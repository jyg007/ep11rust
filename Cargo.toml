[package]
name = "ep11rust2"
version = "0.1.0"
edition = "2024"

[dependencies]
libloading = "0.8"
hex = "0.4"
libc="0.2"
chrono="0.4"
sha2 = "0.10"
aes = "0.8"
aes-keywrap = "0.9"
byteorder = "1.4"
cbc = "0.1"
cipher = "0.4"
rand = "0.8"
der = "0.7"
x509-parser = "0.16"
k256 = { version = "0.12", features = ["ecdsa"] }
openssl = { version = "0.10.75", features = ["vendored"] }  
openssl-sys = "0.9" 
